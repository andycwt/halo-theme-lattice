<!--/* 文章頁（階段 5 的最小版本，供目錄元件使用；完整內容在階段 6） */-->
<include src="layout.html" page="post">
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|">Post</title>
  </template>
  <article>
    <h1 th:text="${post.spec.title}">Post title</h1>
    <div class="prose" data-toc-source th:utext="${post.content.content}"></div>
  </article>
</include>
