<!--/*
  瞬間列表（由 plugin-moments 提供 /moments 路由與變數 moments、tags、title）。
  以 ?tag= 篩選時，頁面標題改為標籤名稱
*/-->
<include src="layout.html" page="moments">
  <th:block
    th:with="
      currentTag=${#arrays.isEmpty(param.tag) ? null : param.tag[0]},
      quoteTag=${not #strings.isEmpty(theme.config.home?.quotesTag) ? #strings.trim(theme.config.home.quotesTag) : '佳句'}
    "
  >
    <header class="page-header">
      <h1 class="page-title" th:text="${currentTag ?: title}">Moments</h1>
    </header>

    <nav th:if="${#lists.size(tags) > 1}" class="moment-tags" th:aria-label="#{moments.tags}">
      <ul class="tag-cloud">
        <li>
          <a
            class="tag-pill"
            th:href="@{/moments}"
            th:aria-current="${currentTag == null ? 'page' : null}"
            th:text="#{moments.all}"
            >All</a
          >
        </li>
        <li th:each="tag : ${tags}">
          <a
            class="tag-pill"
            th:href="@{${tag.permalink}}"
            th:aria-current="${tag.name == currentTag ? 'page' : null}"
          >
            <span th:text="${tag.name}">Tag</span>
            <span class="term-count" th:text="${tag.momentCount}">0</span>
          </a>
        </li>
      </ul>
    </nav>

    <ol th:unless="${#lists.isEmpty(moments.items)}" class="moment-list">
      <li th:each="moment : ${moments.items}">
        <article class="moment">
          <include src="moment-body.html" />
          <footer
            th:unless="${moment.spec.tags != null and moment.spec.tags.contains(quoteTag)}"
            class="moment-meta"
          >
            <a th:href="@{/moments/{name}(name=${moment.metadata.name})}">
              <time
                th:datetime="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd''T''HH:mm:ssXXX')}"
                th:text="${#temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm')}"
                >2026-01-01 00:00</time
              >
            </a>
          </footer>
        </article>
      </li>
    </ol>
    <p th:if="${#lists.isEmpty(moments.items)}" class="empty-state" th:text="#{moments.empty}">
      Nothing here yet.
    </p>
    <th:block th:with="pageResult=${moments}"><include src="pagination.html" /></th:block>
  </th:block>
</include>
