<include src="layout.html" page="page">
  <article class="article">
    <header class="article-header">
      <h1 class="article-title" th:text="${singlePage.spec.title}">Page title</h1>
    </header>
    <th:block th:with="content=${singlePage.content}"
      ><include src="article-content.html"
    /></th:block>
  </article>
  <section th:if="${haloCommentEnabled}" class="comments" th:aria-label="#{post.comments}">
    <halo:comment
      group="content.halo.run"
      kind="SinglePage"
      th:attr="name=${singlePage.metadata.name}"
    />
  </section>
</include>
