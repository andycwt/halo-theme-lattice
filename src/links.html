<!--/*
  友鏈頁（由 plugin-links 提供 /links 路由與變數）。
  依分組以卡片格狀顯示；未分組的連結由插件放在 metadata.name 為 ungrouped 的虛擬分組
*/-->
<include src="layout.html" page="links">
  <template name="head">
    <title th:text="|${linksTitle} - ${site.title}|">Links</title>
  </template>
  <header class="page-header">
    <h1 class="page-title" th:text="${linksTitle}">Links</h1>
  </header>

  <section
    th:each="linkGroup : ${groups}"
    th:unless="${#lists.isEmpty(linkGroup.links)}"
    class="link-group"
  >
    <h2
      class="link-group-title"
      th:text="${linkGroup.metadata.name == 'ungrouped' or #strings.isEmpty(linkGroup.spec?.displayName) ? #messages.msg('links.ungrouped') : linkGroup.spec.displayName}"
    >
      Group
    </h2>
    <ul class="link-grid">
      <li th:each="link : ${linkGroup.links}">
        <a class="link-card" th:href="${link.spec.url}" target="_blank" rel="noopener">
          <img
            th:if="${not #strings.isEmpty(link.spec.logo)}"
            class="link-card-logo"
            th:src="${link.spec.logo}"
            alt=""
            width="48"
            height="48"
            loading="lazy"
          />
          <span
            th:unless="${not #strings.isEmpty(link.spec.logo)}"
            class="link-card-logo link-card-logo-fallback"
            aria-hidden="true"
            th:text="${#strings.substring(link.spec.displayName, 0, 1)}"
            >L</span
          >
          <span class="link-card-body">
            <span class="link-card-name" th:text="${link.spec.displayName}">Name</span>
            <span
              th:if="${not #strings.isEmpty(link.spec.description)}"
              class="link-card-description"
              th:text="${link.spec.description}"
              >Description</span
            >
          </span>
        </a>
      </li>
    </ul>
  </section>
  <p th:if="${#lists.isEmpty(groups)}" class="empty-state" th:text="#{links.empty}">
    No links yet.
  </p>

  <th:block th:with="intro=${theme.config.post?.linksIntro}">
    <div
      th:if="${not #strings.isEmpty(#strings.trim(intro))}"
      class="prose links-intro"
      th:utext="${intro}"
    ></div>
  </th:block>

  <section
    th:if="${haloCommentEnabled and theme.config.post?.linksComments != false}"
    class="comments"
    th:aria-label="#{post.comments}"
  >
    <halo:comment group="plugin.halo.run" kind="Plugin" th:attr="name=${pluginName}" />
  </section>
</include>
