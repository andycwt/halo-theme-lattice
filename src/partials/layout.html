<!--/*
  全站版面。用法：
    <include src="layout.html" page="post">
      <template name="head">頁面專屬的 head 內容（選填）</template>
      主內容
    </include>
  props：page — 頁面類型（index、post、page、archives、categories、category、tags、tag、author、links、moments、moment、error）。
         決定 SEO 資料來源（seo-head.html）；post 套用「文章頁佈局」覆寫並輸出手機版目錄按鈕；error 不顯示側邊欄
*/-->
<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:with="
    pageType='{{page}}',
    style=${theme.config.style},
    colorMode=${#lists.contains({'light', 'dark'}, style?.colorMode) ? style.colorMode : 'auto'},
    colorModeLocked=${style?.lockColorMode == true},
    primaryColor=${style?.primaryColor != null and style.primaryColor matches '^#[0-9a-fA-F]{3,8}$' ? style.primaryColor : null},
    primaryCustomizable=${style?.allowVisitorColor != false},
    customFontFamily=${#strings.trim(style?.customFontFamily)}
  "
  th:lang="${#locale.toLanguageTag()}"
  th:data-color-mode="${colorMode}"
  th:data-color-scheme="${colorMode}"
  th:data-color-mode-locked="${colorModeLocked ? 'true' : null}"
  th:data-primary-customizable="${primaryCustomizable ? 'true' : null}"
  th:data-font="${style?.bodyFont == 'serif' ? 'serif' : 'sans'}"
  th:data-heading-font="${style?.headingFont == 'serif' ? 'serif' : null}"
  th:data-paragraph-indent="${theme.config.post?.paragraphIndent == true ? 'true' : null}"
  th:style="${(primaryColor != null ? '--lattice-primary: ' + primaryColor + ';' : '') + (not #strings.isEmpty(customFontFamily) ? '--font-custom: ' + customFontFamily + ';' : '')}"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <include src="seo-head.html" />
    <slot name="head" />
    <include src="style-head.html" />
    <!--/* 換頁轉場：瀏覽器原生 View Transitions，零 JavaScript；減少動態效果時不啟用 */-->
    <style th:if="${theme.config.advanced?.viewTransitions != false}">
      @media (prefers-reduced-motion: no-preference) {
        @view-transition {
          navigation: auto;
        }
      }
    </style>
    <link rel="stylesheet" href="/css/main.css" />
    <script type="module" src="/js/main.ts"></script>
  </head>
  <body
    th:with="
      layoutConfig=${theme.config.layout},
      layoutModes=${ {'two-column-left', 'two-column-right', 'three-column'} },
      siteLayout=${#lists.contains(layoutModes, layoutConfig?.siteLayout) ? layoutConfig.siteLayout : 'two-column-right'},
      postLayout=${#lists.contains(layoutModes, layoutConfig?.postLayout) ? layoutConfig.postLayout : null},
      layoutMode=${pageType == 'post' and postLayout != null ? postLayout : siteLayout},
      leftWidgets=${theme.config.sidebar?.leftWidgets},
      rightWidgets=${theme.config.sidebar?.rightWidgets},
      hasLeft=${not #lists.isEmpty(leftWidgets)},
      hasRight=${not #lists.isEmpty(rightWidgets)},
      sidebarPosition=${
        pageType == 'error' or (not hasLeft and not hasRight) ? 'none'
        : layoutMode == 'three-column' ? (hasLeft and hasRight ? 'both' : (hasLeft ? 'left' : 'right'))
        : (layoutMode == 'two-column-left' ? 'left' : 'right')
      }
    "
  >
    <a class="skip-link" href="#main" th:text="#{common.skipToContent}">Skip to content</a>
    <include src="site-header.html" />

    <!--/*
      data-sidebar：none（單欄）、left、right（二欄，左右清單合併成一個側邊欄）、both（三欄）
      各寬度下的欄數由 src/css/layout.css 決定
    */-->
    <div class="site-body" th:data-sidebar="${sidebarPosition}">
      <main id="main" class="site-main" tabindex="-1">
        <slot />
      </main>
      <!--/*
        每個側邊欄依序處理一組或多組元件清單：先輸出不吸頂的元件，再把吸頂的元件集中到 .sidebar-sticky。
        三欄時左右清單各一個側邊欄；二欄時兩個清單合併到同一個側邊欄。
      */-->
      <aside
        th:each="aside : ${sidebarPosition == 'both'
          ? { {'primary', {leftWidgets}}, {'secondary', {rightWidgets}} }
          : { {'primary', {leftWidgets, rightWidgets}} }}"
        th:unless="${sidebarPosition == 'none'}"
        th:class="|sidebar sidebar-${aside[0]}|"
        th:aria-label="${#messages.msg('sidebar.' + aside[0])}"
      >
        <div
          th:each="stickyGroup : ${ {false, true} }"
          th:class="${stickyGroup} ? 'sidebar-sticky' : 'sidebar-static'"
        >
          <th:block th:each="widgets : ${aside[1]}">
            <th:block
              th:each="widget : ${widgets}"
              th:if="${(widget.sticky == true) == stickyGroup}"
            >
              <include src="sidebar-widget.html" />
            </th:block>
          </th:block>
        </div>
      </aside>
    </div>

    <include src="site-footer.html" />
    <th:block th:if="${pageType == 'post'}"><include src="toc-fab.html" /></th:block>
    <halo:footer />
  </body>
</html>
