<!--/*
  單則瞬間的內容與媒體。呼叫端需提供變數 moment、quoteTag。
  帶有 quoteTag 標籤的瞬間以引言樣式呈現：第一段英文、第二段翻譯、第三段出處
*/-->
<th:block
  th:with="
    content=${moment.spec.content},
    isQuote=${moment.spec.tags != null and moment.spec.tags.contains(quoteTag)}
  "
>
  <div
    th:if="${not #strings.isEmpty(content.html)}"
    th:class="${isQuote ? 'quote' : 'moment-content prose'}"
    th:utext="${content.html}"
  ></div>
  <div th:unless="${#lists.isEmpty(content.medium)}" class="moment-media">
    <th:block th:each="medium : ${content.medium}">
      <img th:if="${medium.type.name == 'PHOTO'}" th:src="${medium.url}" alt="" loading="lazy" />
      <video th:if="${medium.type.name == 'VIDEO'}" th:src="${medium.url}" controls></video>
      <audio th:if="${medium.type.name == 'AUDIO'}" th:src="${medium.url}" controls></audio>
    </th:block>
  </div>
</th:block>
