<!--/* 分類：顯示兩層（第二層以下的分類不列出，文章數已含子分類） */-->
<th:block th:with="categories=${categoryFinder.listAsTree()}">
  <section th:if="${not #lists.isEmpty(categories)}" class="widget widget-categories">
    <h2 class="widget-title">
      <a th:href="@{/categories}" th:text="#{widget.categories}">Categories</a>
    </h2>
    <ul class="term-list">
      <li th:each="category : ${categories}">
        <a class="term-link" th:href="@{${category.status.permalink}}">
          <span th:text="${category.spec.displayName}">Category</span>
          <span class="term-count" th:text="${category.postCount}">0</span>
        </a>
        <ul th:unless="${#lists.isEmpty(category.children)}" class="term-list term-list-nested">
          <li th:each="child : ${category.children}">
            <a class="term-link" th:href="@{${child.status.permalink}}">
              <span th:text="${child.spec.displayName}">Category</span>
              <span class="term-count" th:text="${child.postCount}">0</span>
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </section>
</th:block>
