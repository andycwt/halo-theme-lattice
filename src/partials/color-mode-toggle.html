<!--/* 深淺色切換按鈕：依序循環 自動 → 淺色 → 深色；站長鎖定模式時不輸出 */-->
<button
  th:unless="${colorModeLocked}"
  type="button"
  class="color-mode-toggle"
  data-color-mode-toggle
  th:data-label-auto="${#messages.msg('colorMode.current', #messages.msg('colorMode.auto'))}"
  th:data-label-light="${#messages.msg('colorMode.current', #messages.msg('colorMode.light'))}"
  th:data-label-dark="${#messages.msg('colorMode.current', #messages.msg('colorMode.dark'))}"
>
  <svg
    class="icon-auto"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="9" />
    <path d="M12 3v18" />
    <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" />
  </svg>
  <svg
    class="icon-light"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="4" />
    <path
      d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
    />
  </svg>
  <svg
    class="icon-dark"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path
      d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
    />
  </svg>
</button>
