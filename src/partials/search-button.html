<!--/* 搜尋入口：只有 plugin-search-widget 啟用時輸出；src/js/search.ts 在找不到 SearchWidget 時隱藏 */-->
<button
  th:if="${pluginFinder.available('PluginSearchWidget')}"
  type="button"
  class="icon-button"
  data-search-open
  th:aria-label="#{nav.search}"
  th:title="#{nav.search}"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <circle cx="11" cy="11" r="7" />
    <path d="M20 20l-3.5-3.5" />
  </svg>
</button>
