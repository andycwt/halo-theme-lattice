<!--/*
  防閃爍：在 CSS 套用前，依訪客儲存的選擇設定 data-color-mode。
  必須是 <head> 中的同步 inline script；站長鎖定模式時不讀取訪客選擇。
  儲存鍵名需與 src/js/color-mode.ts 一致。 */-->
<script>
  (() => {
    const root = document.documentElement;
    if (root.hasAttribute("data-color-mode-locked")) return;
    try {
      const mode = localStorage.getItem("lattice-color-mode");
      if (mode === "auto" || mode === "light" || mode === "dark") root.dataset.colorMode = mode;
    } catch {}
  })();
</script>
