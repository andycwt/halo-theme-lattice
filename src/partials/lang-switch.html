<!--/*
  語系切換（disclosure 選單）。語言名稱固定以該語言本身書寫，不翻譯。
  切換機制見 src/js/lang-switch.ts
*/-->
<div class="lang-switch" data-lang-switch th:with="currentLang=${#locale.toLanguageTag()}">
  <button
    type="button"
    class="icon-button"
    data-lang-switch-toggle
    aria-expanded="false"
    aria-controls="lang-switch-menu"
    th:aria-label="#{nav.language}"
    th:title="#{nav.language}"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18" />
      <ellipse cx="12" cy="12" rx="4" ry="9" />
    </svg>
  </button>
  <ul class="lang-switch-menu" id="lang-switch-menu" hidden>
    <li th:each="lang : ${ { {'en', 'English'}, {'zh-TW', '繁體中文'}, {'zh-CN', '简体中文'} } }">
      <button
        type="button"
        class="lang-switch-option"
        th:data-lang="${lang[0]}"
        th:lang="${lang[0]}"
        th:aria-current="${#strings.startsWith(currentLang, lang[0]) or (lang[0] == 'en' and not #strings.startsWith(currentLang, 'zh')) ? 'true' : null}"
        th:text="${lang[1]}"
      ></button>
    </li>
  </ul>
</div>
