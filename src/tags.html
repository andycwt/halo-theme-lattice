<include src="layout.html" page="tags">
  <template name="head">
    <title th:text="|#{tags.title} - ${site.title}|">Tags</title>
  </template>
  <header class="page-header">
    <h1 class="page-title" th:text="#{tags.title}">Tags</h1>
  </header>
  <ul th:unless="${#lists.isEmpty(tags)}" class="tag-cloud tag-cloud-large">
    <li th:each="tag : ${tags}">
      <a class="tag-pill" th:href="@{${tag.status.permalink}}">
        <span th:text="${tag.spec.displayName}">Tag</span>
        <span class="term-count" th:text="${tag.postCount}">0</span>
      </a>
    </li>
  </ul>
  <p th:if="${#lists.isEmpty(tags)}" class="empty-state" th:text="#{list.empty}">No posts yet.</p>
</include>
