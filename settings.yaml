apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-lattice-setting
spec:
  forms:
    - group: layout
      label: 佈局
      formSchema:
        - $formkit: radio
          name: siteLayout
          label: 整站佈局
          help: 二欄時，左右兩個側邊欄清單的元件會依序合併到同一個側邊欄。螢幕寬度不足時會自動減少欄數。
          value: two-column-right
          options:
            - label: 二欄（側邊欄在左）
              value: two-column-left
            - label: 二欄（側邊欄在右）
              value: two-column-right
            - label: 三欄
              value: three-column
        - $formkit: radio
          name: postLayout
          label: 文章頁佈局
          value: follow
          options:
            - label: 跟隨整站佈局
              value: follow
            - label: 二欄（側邊欄在左）
              value: two-column-left
            - label: 二欄（側邊欄在右）
              value: two-column-right
            - label: 三欄
              value: three-column
        - $formkit: radio
          name: postListStyle
          label: 文章列表樣式
          help: 用於首頁、分類、標籤、作者頁。選擇卡片時，沒有封面圖的文章會以文字樣式顯示。
          value: text
          options:
            - label: 純文字列表
              value: text
            - label: 卡片
              value: card

    - group: style
      label: 外觀
      formSchema:
        - $formkit: color
          name: primaryColor
          label: 主色
          help: 背景、文字、邊框與強調色都由主色推算；強調色會自動調整亮度，以維持足夠的對比。
          format: hex
          value: "#2f6bd8"
        - $formkit: switch
          name: allowVisitorColor
          label: 允許訪客自訂主色
          help: 導覽列顯示調色盤按鈕，訪客可以選擇預設色票或自訂顏色，選擇只存在訪客自己的瀏覽器。關閉時隱藏按鈕，所有訪客都使用上方的主色。
          value: true
        - $formkit: radio
          name: colorMode
          label: 預設深淺色模式
          value: auto
          options:
            - label: 自動（跟隨訪客的系統設定）
              value: auto
            - label: 淺色
              value: light
            - label: 深色
              value: dark
        - $formkit: switch
          name: lockColorMode
          label: 鎖定深淺色模式
          help: 開啟後隱藏切換按鈕，所有訪客都使用預設模式。
          value: false
        - $formkit: radio
          name: bodyFont
          label: 正文字型
          value: sans
          options:
            - label: 無襯線
              value: sans
            - label: 襯線
              value: serif
        - $formkit: url
          name: customFontUrl
          label: 自訂字型 CSS 網址
          help: 例如 Google Fonts 的 CSS 網址。填寫後也要填下方的 font-family。
          validation: url
          value: ""
        - $formkit: text
          name: customFontFamily
          label: 自訂字型 font-family
          help: 例如 "LXGW WenKai TC", serif。會優先於上方的正文字型。
          value: ""

    - group: sidebar
      label: 側邊欄
      formSchema:
        - $formkit: array
          name: leftWidgets
          label: 左側邊欄元件
          help: 依序顯示。二欄佈局時，左右兩個清單會依序合併到同一個側邊欄。
          value:
            - type: profile
              sticky: false
            - type: toc
              sticky: true
          itemLabels:
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 元件
              value: profile
              options:
                - label: 個人資料
                  value: profile
                - label: 公告
                  value: announcement
                - label: 分類
                  value: categories
                - label: 標籤
                  value: tags
                - label: 最新文章
                  value: recentPosts
                - label: 站點統計
                  value: siteStats
                - label: 文章目錄（只在文章頁顯示）
                  value: toc
                - label: 自訂 HTML
                  value: customHtml
            - $formkit: switch
              name: sticky
              label: 吸頂
              help: 吸頂的元件會集中在側邊欄最下方，捲動時一起停靠在導覽列下方。單欄（手機）時不吸頂。
              value: false
            - $formkit: textarea
              if: "$value.type === 'customHtml'"
              name: html
              label: HTML 內容
              value: ""
        - $formkit: array
          name: rightWidgets
          label: 右側邊欄元件
          help: 三欄佈局時顯示在右側；二欄佈局時接在左側邊欄清單之後。
          value:
            - type: recentPosts
              sticky: false
            - type: categories
              sticky: false
            - type: tags
              sticky: false
          itemLabels:
            - type: text
              label: $value.type
          children:
            - $formkit: select
              name: type
              label: 元件
              value: profile
              options:
                - label: 個人資料
                  value: profile
                - label: 公告
                  value: announcement
                - label: 分類
                  value: categories
                - label: 標籤
                  value: tags
                - label: 最新文章
                  value: recentPosts
                - label: 站點統計
                  value: siteStats
                - label: 文章目錄（只在文章頁顯示）
                  value: toc
                - label: 自訂 HTML
                  value: customHtml
            - $formkit: switch
              name: sticky
              label: 吸頂
              help: 吸頂的元件會集中在側邊欄最下方，捲動時一起停靠在導覽列下方。單欄（手機）時不吸頂。
              value: false
            - $formkit: textarea
              if: "$value.type === 'customHtml'"
              name: html
              label: HTML 內容
              value: ""
        - $formkit: textarea
          name: announcement
          label: 公告內容
          help: 可使用 HTML。留空時不顯示公告元件。
          value: ""
        - $formkit: number
          name: recentPostsCount
          label: 最新文章數量
          value: 5
          min: 1
          max: 20
          validation: required|between:1,20
        - $formkit: number
          name: tagsCount
          label: 標籤顯示數量
          help: 標籤元件依文章數由多到少顯示的數量，其餘標籤可從「查看全部」進入標籤頁瀏覽。
          value: 30
          min: 1
          max: 100
          validation: required|between:1,100

    - group: profile
      label: 個人資料
      formSchema:
        - $formkit: attachment
          name: avatar
          label: 頭像
          help: 留空時使用系統設定的 Logo。
          accepts:
            - "image/*"
          value: ""
        - $formkit: text
          name: nickname
          label: 暱稱
          help: 留空時使用站點標題。
          value: ""
        - $formkit: textarea
          name: bio
          label: 簡介
          help: 留空時使用站點副標題。
          value: ""
        - $formkit: array
          name: socials
          label: 社群連結
          value: []
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: text
              name: name
              label: 名稱
              value: ""
              validation: required
            - $formkit: url
              name: url
              label: 網址
              help: "也可以填 mailto: 開頭的電子郵件連結。"
              value: ""
              validation: required

    - group: home
      label: 首頁
      formSchema:
        - $formkit: switch
          name: heroEnabled
          label: 顯示首頁簡介區塊
          help: 只在首頁第一頁顯示。
          value: false
        - $formkit: text
          name: heroTitle
          label: 大標題
          help: 留空時使用站點標題。
          value: ""
        - $formkit: textarea
          name: heroSubtitle
          label: 副標題
          help: 留空時使用站點副標題。
          value: ""
        - $formkit: attachment
          name: heroImage
          label: 背景圖
          help: 選填。有背景圖時，文字會加上半透明遮罩以維持可讀性。
          accepts:
            - "image/*"
          aspectRatio: 16/9
          width: 12rem
          value: ""

    - group: post
      label: 文章
      formSchema:
        - $formkit: switch
          name: highlightEnabled
          label: 內建程式碼高亮
          help: 使用主題內建的 highlight.js。已啟用 Shiki 等程式碼高亮插件時，主題會自動停用內建高亮，避免重複處理。
          value: true
        - $formkit: switch
          name: aboutComments
          label: 關於頁顯示留言
          help: 套用「關於頁」模板的頁面是否顯示留言區（需安裝留言插件）。
          value: true
        - $formkit: switch
          name: linksComments
          label: 友鏈頁顯示留言
          help: 友鏈頁（需安裝 plugin-links）是否顯示留言區（需安裝留言插件）。
          value: true
        - $formkit: textarea
          name: linksIntro
          label: 友鏈頁說明
          help: 顯示在友鏈頁底部，例如申請友鏈的方式。可使用 HTML，留空時不顯示。
          value: ""

    - group: advanced
      label: 進階
      formSchema:
        - $formkit: switch
          name: viewTransitions
          label: 換頁轉場效果
          help: 使用瀏覽器原生的 View Transitions 在換頁時淡入淡出，不需要 JavaScript。不支援的瀏覽器與開啟「減少動態效果」的訪客會直接換頁。
          value: true
        - $formkit: switch
          name: seoMetadata
          label: 輸出頁面元資料
          help: canonical、Open Graph、Twitter Card。已使用 SEO 插件輸出這些標籤時請關閉，避免重複。頁面描述（description）由 Halo 自動輸出。
          value: true
        - $formkit: switch
          name: seoStructuredData
          label: 輸出結構化資料
          help: JSON-LD（首頁 WebSite、文章 BlogPosting、麵包屑 BreadcrumbList）。已使用 SEO 插件輸出結構化資料時請關閉。
          value: true
        - $formkit: attachment
          name: defaultShareImage
          label: 預設分享圖
          help: 文章或頁面沒有封面圖時，社群分享使用這張圖。建議 1200 × 630。留空時使用系統設定的 Logo。
          accepts:
            - "image/*"
          aspectRatio: 1200/630
          width: 12rem
          value: ""
