apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-lattice
spec:
  displayName: Lattice
  author:
    name: WeiTsung Chu
    website: https://github.com/andycwt
  homepage: https://github.com/andycwt/halo-theme-lattice
  repo: https://github.com/andycwt/halo-theme-lattice
  issues: https://github.com/andycwt/halo-theme-lattice/issues
  description: A clean, content-first Halo theme with configurable layout and colors.
  logo: /themes/theme-lattice/assets/logo.svg
  customTemplates:
    page:
      - name: 關於頁
        description: 頂部顯示個人資料（頭像、暱稱、簡介、社群連結，沿用主題設定的「個人資料」），下方為頁面正文
        file: page_about.html
  settingName: theme-lattice-setting
  configMapName: theme-lattice-configMap
  version: 0.1.1
  requires: ">=2.25.0"
  license:
    - name: MIT
